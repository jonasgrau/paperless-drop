name: PaperlessDrop
options:
  bundleIdPrefix: de.jonas
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  PaperlessDrop:
    type: application
    platform: macOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Paperless Drop
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.jonas.PaperlessDrop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  # Unit tests for the logic that doesn't need the UI. They compile these source files
  # directly instead of using the app as a test host, which would start the menu bar app.
  PaperlessDropTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Sources/PaperlessClient.swift
      - Sources/UploadQueue.swift
      - Sources/Keychain.swift
      - Sources/Notifier.swift
      - Sources/DropTarget.swift
      - Sources/UpdateChecker.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.jonas.PaperlessDropTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PaperlessDrop:
    build:
      targets:
        PaperlessDrop: all
    test:
      targets:
        - PaperlessDropTests
